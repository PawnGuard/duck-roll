worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 5;
    client_body_temp_path /tmp/client_body_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /internal/incident-dashboard {
            return 301 /internal/incident-dashboard/;
        }

        location = /dashboard {
            return 301 /internal/incident-dashboard/;
        }

        location ^~ /internal/ {
            root /tmp;
            index index.html;
            try_files $uri $uri/ =404;
        }

        location ~ ^/(it|employee-resources|infrastructure|security-policies)/ {
            try_files /placeholder.html =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}

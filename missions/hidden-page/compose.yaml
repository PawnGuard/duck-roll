name: hidden-page-${PAIR_ID:?Set PAIR_ID in .env}

services:
  company-web:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${LAB_HOST_IP:?Set LAB_HOST_IP in .env}:${HOST_PORT:?Set HOST_PORT in .env}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    secrets:
      - hidden_page_flag
      - support_staff_htpasswd
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3

secrets:
  hidden_page_flag:
    file: ${FLAG_FILE:?Run sh prepare-mission.sh and set FLAG_FILE in .env}
  support_staff_htpasswd:
    file: ${AUTH_FILE:?Run sh prepare-mission.sh and set AUTH_FILE in .env}

services:
  hidden-page:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${LAB_HOST_IP:?Set LAB_HOST_IP in .env}:8080:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    secrets:
      - hidden_page_flag

secrets:
  hidden_page_flag:
    file: ${FLAG_FILE:?Run sh prepare-flag.sh and set FLAG_FILE in .env}
